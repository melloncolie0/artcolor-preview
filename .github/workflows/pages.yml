name: Publish Artcolor preview

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Restore verified website package
        shell: bash
        run: |
          cat preview-oct31.zip.0?? > site.zip
          echo 'c749bca427e577b7b572e5d49ba054251735b763971be20b2fd8f9e6f9a6d4e0  site.zip' | sha256sum --check
          mkdir _site
          unzip -q site.zip -d _site
          test -s _site/index.html
          test -s _site/private/index.html
          test "$(find _site -type f | wc -l)" -eq 1522
          echo '182abf47368288d782f0e18ef050cb0ff6a1e5341b81fe14d9a0897ff5d63cc7  update-nov01.zip' | sha256sum --check
          unzip -qo update-nov01.zip -d _site
          grep -q 'header-call' _site/index.html
          grep -q 'plus-nov01-r1' _site/app.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
